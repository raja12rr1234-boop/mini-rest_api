# 1. Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/products_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
# تحديد الـ Port د الـ Server (مثلاً 8080 ولا 8081)
server.port=9020
# 2. JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Disable Spring AI Redis Vector Store
spring.ai.vectorstore.redis.enabled=false
# تعطيل استخدام Redis للـ Sessions
spring.session.store-type=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
# تحويل نوع الـ Session لـ none أو none/HashMap
